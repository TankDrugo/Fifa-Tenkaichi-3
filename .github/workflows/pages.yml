# The game's site on GitHub Pages, rebuilt at every push to main that changes the old game: the
# game itself (web/, with a doctype in front of index.html), the itch.io zip and version.json, which
# the Windows exe reads to know when to download the zip again (tools/web_launcher/update.go).
# A push that only touches the new game (apps/, packages/, infra/, docs) leaves the site and
# version.json as they are, so the exe does not download the same game again.
name: Sito del gioco

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r web/js web/assets _site/
          { printf '<!doctype html>\n'; grep -v -i '^<!doctype' web/index.html; } > _site/index.html
          (cd _site && zip -qr -X ../strikelegends-web.zip index.html js assets)
          mv strikelegends-web.zip _site/
          printf '{"version":"%s","date":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
