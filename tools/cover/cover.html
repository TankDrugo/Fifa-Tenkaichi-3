<script>
  // Deterministic decoration: the same picture at every render.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const NS = "http://www.w3.org/2000/svg";
  const star = (n, r1, r2, jitter) => Array.from({ length: n * 2 }, (_, i) => {
    const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2, r = (i % 2 ? r2 : r1) * (1 + (jitter ? (rnd() - 0.5) * jitter : 0));
    return (Math.cos(a) * r).toFixed(1) + "," + (Math.sin(a) * r).toFixed(1);
  }).join(" ");
  // rays from behind the footballer
  const rays = document.getElementById("rays");
  for (let i = 0; i < 18; i++) {
    const a0 = (i / 18) * Math.PI * 2, a1 = a0 + Math.PI / 36, cx = 232, cy = 312, R = 900;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${cx} ${cy} L${cx + Math.cos(a0) * R} ${cy + Math.sin(a0) * R} L${cx + Math.cos(a1) * R} ${cy + Math.sin(a1) * R} Z`);
    p.setAttribute("fill", "#fff6c2");
    rays.appendChild(p);
  }
  document.getElementById("burst").setAttribute("points", star(16, 128, 92, 0.18));
  document.getElementById("burst2").setAttribute("points", star(16, 96, 70, 0.12));
  document.getElementById("superburst").setAttribute("points", star(14, 58, 44, 0.08));
  // the title's depth: copies stepping down and right
  const ex = document.getElementById("tk-extrude");
  for (let k = 7; k >= 1; k--) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "bang"); t.setAttribute("font-size", "106"); t.setAttribute("letter-spacing", "1");
    t.setAttribute("x", k * 1.2); t.setAttribute("y", k * 1.2);
    t.setAttribute("fill", k > 5 ? "#3a0510" : "#7a0c1c"); t.setAttribute("stroke", "#14091f"); t.setAttribute("stroke-width", "10"); t.setAttribute("stroke-linejoin", "round");
    t.textContent = "TENKAICHI"; ex.appendChild(t);
  }
  // chipped cardboard along the edges
  const chips = document.getElementById("chips");
  for (let i = 0; i < 70; i++) {
    const side = Math.floor(rnd() * 4), u = rnd(), s = 1 + rnd() * 3.5;
    const [x, y] = side === 0 ? [u * 630, 0] : side === 1 ? [630, u * 500] : side === 2 ? [u * 630, 500] : [0, u * 500];
    const c = document.createElementNS(NS, "polygon");
    c.setAttribute("points", star(3, s * 1.6, s * 0.8, 0.6));
    c.setAttribute("transform", `translate(${x} ${y}) rotate(${Math.round(rnd() * 360)})`);
    chips.appendChild(c);
  }
  // the aura: flame tongues around the footballer, longer and bent upwards on top, each side bowed
  // inwards so the tips come to a point (drawn last, so the numbers above keep the logo unchanged)
  const flames = (cx, cy, rx, ry, n, grow) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, up = Math.max(0, -Math.sin(a));
      let x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      if (i % 2) { const L = (14 + 30 * up + rnd() * 10) * grow; x += Math.cos(a) * L * 0.45; y += Math.sin(a) * L * 0.45 - (12 + 40 * up + rnd() * 12) * grow; }
      pts.push([x, y]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 1; i <= n; i++) {
      const [px, py] = pts[i % n], [qx, qy] = pts[i - 1], mx = (px + qx) / 2, my = (py + qy) / 2;
      d += ` Q${(mx + (cx - mx) * 0.16).toFixed(1)} ${(my + (cy - my) * 0.16).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
    }
    return d + " Z";
  };
  const auraG = document.getElementById("auraFlames");
  for (const [d, fill, stroke, w] of [[flames(212, 312, 132, 140, 30, 1), "#ffc81a", "#ff5a00", 5], [flames(212, 318, 84, 104, 22, 0.6), "#fff1a0", "none", 0]]) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d); p.setAttribute("fill", fill); p.setAttribute("stroke", stroke); p.setAttribute("stroke-width", w);
    p.setAttribute("opacity", "0.92"); auraG.appendChild(p);
  }
  // ?only=logo or ?only=wordmark: that group alone, cropped to its box, on a transparent page
  const only = new URLSearchParams(location.search).get("only");
  window.ready = document.fonts.ready.then(() => {
    if (!only) return { w: 630, h: 500 };
    const svg = document.getElementById("cover"), art = document.getElementById("art"), keep = document.getElementById(only);
    keep.removeAttribute("display");
    for (const el of [...art.children]) if (el !== keep) el.setAttribute("display", "none");
    art.removeAttribute("clip-path");
    const b = keep.getBBox(), pad = 14;
    const vb = [b.x - pad, b.y - pad, b.width + 2 * pad, b.height + 2 * pad].map((v) => Math.round(v));
    svg.setAttribute("viewBox", vb.join(" "));
    svg.setAttribute("width", vb[2]); svg.setAttribute("height", vb[3]);
    return { w: vb[2], h: vb[3] };
  });
</script>
